<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Samura — links</title>
<style>
:root{color-scheme:dark;--white:#f4f4f4;--muted:#aaa}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:28px 16px;color:var(--white);background:#030303 url("background.png") center center/cover fixed no-repeat}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.24),rgba(0,0,0,.72) 32%,rgba(0,0,0,.72) 68%,rgba(0,0,0,.3));pointer-events:none}
.wrap{position:relative;width:min(100%,520px)}
.topline{display:flex;justify-content:space-between;align-items:center;margin:0 6px 14px;color:#c4c4c4;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.live{display:flex;align-items:center;gap:7px}.dot{width:6px;height:6px;border-radius:50%;background:#eee;box-shadow:0 0 9px #fff}
.card{position:relative;padding:32px 28px 25px;border:1px solid rgba(255,255,255,.2);border-radius:22px;background:rgba(0,0,0,.63);backdrop-filter:blur(14px);box-shadow:0 25px 90px #000a;overflow:hidden}
.profile{display:flex;align-items:center;flex-direction:column;text-align:center}
.avatar-shell{width:116px;height:116px;padding:3px;border:1px solid #eee;border-radius:50%;box-shadow:0 0 28px #ffffff30}
.avatar{width:100%;height:100%;display:block;object-fit:cover;object-position:center 32%;border-radius:50%;filter:grayscale(100%) contrast(1.08)}
h1{font-family:Georgia,serif;font-style:italic;margin:18px 0 3px;font-size:clamp(42px,9vw,56px);letter-spacing:-.06em;color:#fff;text-shadow:0 0 20px #ffffff35}
.subtitle{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#bcbcbc;margin:5px 0 18px}
.rule{height:1px;width:110px;background:linear-gradient(90deg,transparent,#fff,transparent);margin-bottom:22px}
.links{display:flex;justify-content:center;gap:13px;margin-bottom:23px}
.social{display:grid;place-items:center;width:54px;height:54px;border:1px solid #ffffff55;border-radius:15px;background:#ffffff09;color:white;text-decoration:none;transition:.2s}
.social:hover{transform:translateY(-3px);background:#ffffff20;border-color:white;box-shadow:0 0 20px #ffffff20}
.social svg{width:24px;height:24px;fill:currentColor}
.music{padding:15px;border:1px solid #ffffff35;border-radius:16px;background:#0009}
.music-head{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.cover{width:54px;height:54px;flex-shrink:0;object-fit:cover;object-position:center;border-radius:9px;filter:grayscale(100%);border:1px solid #ffffff35}
.track{flex:1;text-align:left;min-width:0}.track strong{display:block;font-size:14px;letter-spacing:.06em}.track small{display:block;margin-top:4px;color:#aaa;font-size:12px}
.equalizer{display:flex;align-items:center;gap:3px;height:24px}.equalizer i{display:block;width:2px;background:#eee;border-radius:4px;animation:wave .8s ease-in-out infinite alternate}.equalizer i:nth-child(1){height:7px}.equalizer i:nth-child(2){height:16px;animation-delay:.2s}.equalizer i:nth-child(3){height:11px;animation-delay:.4s}.equalizer i:nth-child(4){height:20px;animation-delay:.1s}.equalizer i:nth-child(5){height:8px;animation-delay:.3s}
@keyframes wave{to{transform:scaleY(.45);opacity:.55}}
.playrow{display:flex;align-items:center;gap:12px}
.playbtn{border:1px solid #eee;border-radius:999px;padding:9px 16px;background:#fff;color:#050505;font-weight:750;cursor:pointer}
.playbtn:hover{background:#ddd}
.hint{color:#aaa;font-size:10px;line-height:1.45}
.youtube{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:13px;background:#000}
.foot{text-align:center;color:#aaa;font-size:10px;letter-spacing:.16em;margin-top:15px}
@media(max-width:420px){.card{padding:25px 16px 20px}.avatar-shell{width:100px;height:100px}.social{width:50px;height:50px}.topline{font-size:9px}.music{padding:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  <section class="card">

</main>
